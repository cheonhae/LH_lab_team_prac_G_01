<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>입주 신청 서류 점검</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main>
  <h1>G3조 공공임대 입주 신청 서류 점검 도구</h1>
  <p class="virtual">가상 자료로 만든 실습용 도구입니다. 실명·연락처·실제 자료를 넣지 마세요.</p>

  <h2>메뉴</h2>
  <ul class="menu">
    <li><a href="pages/docs_check.html">기능 A — 누락 서류 대조</a></li>
    <li><a href="pages/docs_date.html">기능 B — 발급일 유효 확인</a></li>
  </ul>

  <h2>저장된 데이터 요약</h2>
  <ul class="summary">
    <li>누락 <strong id="count-missing">0</strong></li>
    <li>발급일 어긋남 <strong id="count-date">0</strong></li>
    <li>확인 필요 <strong id="count-checks">0</strong></li>
  </ul>
  <p class="notice">결과는 점검 대상일 뿐입니다 — 담당 검토 후 확정</p>

  <h2>데이터 관리</h2>
  <p><button type="button" id="btn-clear">비우기</button></p>
  <p id="message" role="status"></p>
</main>
<script src="assets/common.js"></script>
<script>
  /* 요약: 누락 = missing 건수, 발급일 어긋남 = dateIssues 건수, 확인 필요 = checks 건수(기능 A·B 합) */
  function renderSummary() {
    var data = loadData();
    document.getElementById("count-missing").textContent = data.missing.length;
    document.getElementById("count-date").textContent = data.dateIssues.length;
    document.getElementById("count-checks").textContent = data.checks.length;
  }

  document.getElementById("btn-clear").addEventListener("click", function () {
    if (!window.confirm("저장된 데이터를 모두 비웁니다. 계속할까요?")) return;
    clearData();
    renderSummary();
    document.getElementById("message").textContent = "비웠습니다.";
  });

  renderSummary();
  /* 다른 페이지에서 '뒤로'로 돌아와도 최신 숫자를 보이게 */
  window.addEventListener("pageshow", renderSummary);
</script>
</body>
</html>
